name: Daily wishlist check

# Runs entirely on GitHub's infrastructure — no dependency on any machine being on.
# 03:00 UTC = 08:30 IST. Adjust the cron below to change the time.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed to commit data/prices.db back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Price check (fetches prices, alerts on drops)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python track.py check

      - name: Buy-or-wait model (also refreshes IsThereAnyDeal history)
        env:
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
        # Not sent to Telegram — verdicts barely change day to day, and the point of
        # running this here is the side effect: importing each game's full discount
        # history. `check`'s own alerts already cover "something changed today".
        run: python track.py advise --all

      - name: Sale research (web search, records notes, Telegrams a summary)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python track.py research --telegram

      - name: Commit updated price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.db
          git diff --cached --quiet || git commit -m "Daily price check: $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
